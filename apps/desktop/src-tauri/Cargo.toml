[package]
name = "glassleaf-desktop"
version = "0.1.0"
description = "Glassleaf desktop shell"
authors = ["Glassleaf"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "glassleaf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4.1.5"
open = "5.4.3"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
url = "2.5"
