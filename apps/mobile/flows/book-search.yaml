appId: app.glassleaf.mobile
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "A good place to pause."
    timeout: 30000
- tapOn: "Search"
- tapOn:
    id: "field-Search everything"
- inputText: "light"
- extendedWaitUntil:
    visible: "book: The Shape of Light"
    timeout: 15000
- tapOn: "book: The Shape of Light"
- extendedWaitUntil:
    visible: ".*The morning.*"
    timeout: 20000
- tapOn:
    text: "Reading settings"
    retryTapIfNoChange: true
- tapOn: "Find in this book"
- assertVisible: "Searching The Shape of Light"
- assertVisible: "Search this book"
- tapOn:
    id: "field-Search everything"
- inputText: "morning"
- extendedWaitUntil:
    visible: "passage: Chapter 1"
    timeout: 15000
- takeScreenshot: mocha-book-search
