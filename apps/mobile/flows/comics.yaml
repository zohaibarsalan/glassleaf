appId: app.glassleaf.mobile
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Filters & sort"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- tapOn: "Tokyo Night theme"
- tapOn: "Library"
- tapOn: "Search library"
- inputText: "moon"
- tapOn: "Read (moon-garden|Moon Garden), .*"
- tapOn: "Reading settings"
- tapOn: "Single page"
- tapOn: "Right to left"
- tapOn: "Close"
- tapOn: "Contents and bookmarks"
- tapOn:
    id: "field-Go to page"
- eraseText
- inputText: "1"
- tapOn: "Go"
- assertVisible: "Page 1 of 12"
- tapOn: "Next page"
- assertVisible: "Page 2 of 12"
- swipe:
    start: 25%, 50%
    end: 75%, 50%
    duration: 400
- assertVisible: "Page 3 of 12"
- takeScreenshot: tokyo-night-comic-page
- tapOn: "Reading settings"
- tapOn: "Spreads"
- tapOn: "Close"
- takeScreenshot: tokyo-night-comic-spread
- tapOn: "Next page"
- tapOn: "Reading settings"
- tapOn: "Zoom in"
- assertVisible: "1.5×"
- tapOn: "Close"
- takeScreenshot: tokyo-night-comic-zoom
- tapOn: "Reading settings"
- tapOn: "Scroll"
- tapOn: "Close"
- swipe:
    direction: UP
- takeScreenshot: tokyo-night-comic-scroll
- tapOn: "Back to library"
