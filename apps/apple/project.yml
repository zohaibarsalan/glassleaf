name: Glassleaf

options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: app.glassleaf
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

packages:
  GlassleafDomain:
    path: ../../packages/domain

targets:
  Glassleaf:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Glassleaf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
        LSApplicationCategoryType: public.app-category.books
        NSHumanReadableCopyright: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Glassleaf Library
            UTTypeIdentifier: app.glassleaf.library
            UTTypeTagSpecification:
              public.filename-extension:
                - glassleaflibrary
              public.mime-type: application/vnd.glassleaf.library
    dependencies:
      - package: GlassleafDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.glassleaf.reader
        PRODUCT_NAME: Glassleaf
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lz"
    scheme:
      gatherCoverageData: true

schemes:
  Glassleaf:
    build:
      targets:
        Glassleaf: all
    run:
      config: Debug
    test:
      config: Debug
