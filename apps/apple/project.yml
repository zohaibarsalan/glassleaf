name: Glassleaf

options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: app.glassleaf
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

packages:
  GlassleafDomain:
    path: ../../packages/domain

targets:
  Glassleaf:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - Sources
      - Support/Assets.xcassets
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Glassleaf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: Glassleaf Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.glassleaf.library
        LSApplicationCategoryType: public.app-category.books
        NSHumanReadableCopyright: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportsDocumentBrowser: false
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - com.apple.package
            UTTypeDescription: Glassleaf Library
            UTTypeIdentifier: app.glassleaf.library
            UTTypeTagSpecification:
              public.filename-extension:
                - glassleaflibrary
              public.mime-type: application/vnd.glassleaf.library
    dependencies:
      - package: GlassleafDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.glassleaf.reader
        PRODUCT_NAME: Glassleaf
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: Support/Glassleaf.entitlements
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lz"
  GlassleafTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - Tests
    dependencies:
      - target: Glassleaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.glassleaf.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Glassleaf.app/Contents/MacOS/Glassleaf"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"

schemes:
  Glassleaf:
    build:
      targets:
        Glassleaf: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GlassleafTests
